<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互動刷題器 - 智慧學習系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="app.switchTab('practice')">
        <div class="p-2 bg-indigo-600 text-white rounded-xl shadow-md shadow-indigo-200">
          <i data-lucide="brain-circuit" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-none">互動刷題器</h1>
          <span class="text-xs text-slate-500">Interactive Quiz Trainer</span>
        </div>
      </div>

      <!-- Chapter / Filter Dropdown & Navigation -->
      <div class="flex items-center gap-2 sm:gap-4">
        <select id="chapterFilter" onchange="app.filterChapter(this.value)" class="text-sm bg-slate-100 border-none rounded-lg px-3 py-2 text-slate-700 font-medium focus:ring-2 focus:ring-indigo-500 cursor-pointer">
          <option value="ALL">全部章節 (CH01 - CH06)</option>
          <option value="CH01">CH01 第一章</option>
          <option value="CH02">CH02 第二章</option>
          <option value="CH03">CH03 第三章</option>
          <option value="CH04">CH04 第四章</option>
          <option value="CH05">CH05 第五章</option>
          <option value="CH06">CH06 第六章</option>
        </select>

        <button onclick="app.openImportModal()" class="flex items-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition">
          <i data-lucide="file-up" class="w-4 h-4"></i>
          <span class="hidden sm:inline">匯入題庫</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6">
      <button id="tab-practice" onclick="app.switchTab('practice')" class="py-3 px-1 border-b-2 font-medium text-sm border-indigo-600 text-indigo-600 flex items-center gap-2">
        <i data-lucide="book-open" class="w-4 h-4"></i> 刷題模式
      </button>
      <button id="tab-exam" onclick="app.switchTab('exam')" class="py-3 px-1 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2">
        <i data-lucide="timer" class="w-4 h-4"></i> 模擬測驗
      </button>
      <button id="tab-mistakes" onclick="app.switchTab('mistakes')" class="py-3 px-1 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2">
        <i data-lucide="x-circle" class="w-4 h-4"></i> 錯題本 <span id="mistakeBadge" class="ml-1 px-2 py-0.5 text-xs bg-rose-100 text-rose-600 rounded-full font-bold">0</span>
      </button>
      <button id="tab-starred" onclick="app.switchTab('starred')" class="py-3 px-1 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2">
        <i data-lucide="star" class="w-4 h-4"></i> 我的收藏 <span id="starredBadge" class="ml-1 px-2 py-0.5 text-xs bg-amber-100 text-amber-700 rounded-full font-bold">0</span>
      </button>
    </div>
  </div>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Left Sidebar / Question List Grid -->
    <aside class="lg:col-span-1 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-[calc(100vh-220px)] sticky top-20">
      <div class="flex items-center justify-between mb-3 pb-3 border-b border-slate-100">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">題目導覽 (<span id="totalQuestionsCount">0</span>)</span>
        <button onclick="app.shuffleQuestions()" class="text-xs text-indigo-600 hover:underline flex items-center gap-1">
          <i data-lucide="shuffle" class="w-3 h-3"></i> 隨機洗牌
        </button>
      </div>

      <!-- Quick Index Grid -->
      <div id="questionGrid" class="grid grid-cols-5 gap-2 overflow-y-auto custom-scrollbar flex-1 pr-1">
        <!-- Rendered by JS -->
      </div>

      <!-- Progress Stats -->
      <div class="mt-4 pt-3 border-t border-slate-100 space-y-2">
        <div class="flex justify-between text-xs font-medium text-slate-600">
          <span>完成進度</span>
          <span id="progressText">0%</span>
        </div>
        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-300"></div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <section class="lg:col-span-3 flex flex-col space-y-4">

      <!-- Exam Header Timer Bar (Hidden in Practice) -->
      <div id="examHeader" class="hidden bg-indigo-900 text-white p-4 rounded-2xl shadow-md flex items-center justify-between">
        <div class="flex items-center gap-3">
          <i data-lucide="clock" class="w-5 h-5 text-indigo-300"></i>
          <span class="text-sm text-indigo-200">剩餘時間：</span>
          <span id="examTimer" class="font-mono text-xl font-bold tracking-wider text-amber-300">30:00</span>
        </div>
        <button onclick="app.submitExam()" class="px-4 py-2 bg-amber-400 hover:bg-amber-300 text-slate-900 rounded-lg text-sm font-bold shadow transition">
          交卷並結算
        </button>
      </div>

      <!-- Question Card -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8 flex-1 flex flex-col justify-between">
        <div>
          <!-- Tags & Question Header -->
          <div class="flex items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2">
              <span id="questionChapterTag" class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full border border-indigo-100">CH01</span>
              <span id="questionIndexTag" class="text-xs font-medium text-slate-400">Question 1 / 100</span>
            </div>
            <button id="starBtn" onclick="app.toggleStarCurrent()" class="p-2 text-slate-300 hover:text-amber-400 rounded-lg transition">
              <i data-lucide="star" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Question Content -->
          <h2 id="questionText" class="text-lg sm:text-xl font-bold text-slate-800 mb-6 leading-relaxed">
            題目載入中...
          </h2>

          <!-- Options Container -->
          <div id="optionsContainer" class="space-y-3 mb-6">
            <!-- Rendered by JS -->
          </div>

          <!-- Rationale / Explanation Box -->
          <div id="explanationBox" class="hidden p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2 mt-4">
            <div class="flex items-center gap-2 font-bold text-sm text-slate-700">
              <i data-lucide="info" class="w-4 h-4 text-indigo-600"></i> 解析說明：
            </div>
            <p id="explanationText" class="text-sm text-slate-600 leading-relaxed">
              答案解析會顯示於此。
            </p>
          </div>
        </div>

        <!-- Card Footer Action Buttons -->
        <div class="flex items-center justify-between pt-6 border-t border-slate-100 mt-6">
          <button id="prevBtn" onclick="app.prevQuestion()" class="flex items-center gap-2 px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-medium transition disabled:opacity-40">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> 上一題
          </button>

          <div class="flex items-center gap-2">
            <button id="toggleAnswerBtn" onclick="app.toggleExplanation()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-medium transition">
              查看解析
            </button>
            <button id="nextBtn" onclick="app.nextQuestion()" class="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-md shadow-indigo-100 transition">
              下一題 <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Import Question Bank Modal -->
  <div id="importModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i data-lucide="file-plus" class="w-5 h-5 text-indigo-600"></i> 匯入自訂題庫 (JSON 格式)
        </h3>
        <button onclick="app.closeImportModal()" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <p class="text-xs text-slate-500 leading-relaxed">
        請貼上符合格式的 JSON 題庫。系統會儲存在您瀏覽器的 LocalStorage 中。
      </p>

      <textarea id="importJsonInput" rows="8" class="w-full font-mono text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder='[
  {
    "chapter": "CH01",
    "question": "範例題目內文？",
    "options": ["選項A", "選項B", "選項C", "選項D"],
    "answer": 0,
    "explanation": "此題解析說明"
  }
]'></textarea>

      <div class="flex items-center justify-between pt-2">
        <button onclick="app.loadDefaultBank()" class="text-xs text-indigo-600 hover:underline">
          恢復預設預載題庫
        </button>
        <div class="flex gap-2">
          <button onclick="app.closeImportModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200">取消</button>
          <button onclick="app.importJson()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 shadow">匯入並套用</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // 預設題庫 (CH01-CH06 模擬題庫100題精選樣板)
    const DEFAULT_QUESTION_BANK = [
      { id: 1, chapter: "CH01", question: "下列何者為資訊系統最基礎的架構組成要素？", options: ["輸入、處理、輸出、回饋", "硬體、軟體、網路、人", "資料、資訊、知識、智慧", "資料庫、伺服器、終端機"], answer: 0, explanation: "資訊系統的基本模型包含輸入 (Input)、處理 (Processing)、輸出 (Output) 以及回饋 (Feedback)。" },
      { id: 2, chapter: "CH01", question: "將原始數據轉換為具備脈絡與意義的內容，此過程稱為？", options: ["智慧化", "資料處理", "知識管理", "數據檢索"], answer: 1, explanation: "資料 (Data) 經過處理後轉換為有意義的資訊 (Information)。" },
      { id: 3, chapter: "CH01", question: "Enterprise Resource Planning (ERP) 的中文名稱為？", options: ["客戶關係管理", "企業資源規劃", "供應鏈管理", "知識管理系統"], answer: 1, explanation: "ERP 全名為 Enterprise Resource Planning，即企業資源規劃系統。" },
      { id: 4, chapter: "CH02", question: "競爭策略理論中，提出「五力分析 (Five Forces Model)」的學者是？", options: ["Michael Porter", "Philip Kotler", "Peter Drucker", "Steve Jobs"], answer: 0, explanation: "邁克爾·波特 (Michael Porter) 提出了產業競爭五力分析模型。" },
      { id: 5, chapter: "CH02", question: "企業利用網路直接向最終消費者銷售產品的商業模式簡稱為？", options: ["B2B", "B2C", "C2C", "G2C"], answer: 1, explanation: "Business-to-Consumer (B2C) 為企業對消費者的電子商務模式。" },
      { id: 6, chapter: "CH02", question: "破壞性創新 (Disruptive Innovation) 理論是由哪位學者提出？", options: ["Clayton Christensen", "Michael Porter", "Bill Gates", "Alan Turing"], answer: 0, explanation: "克雷頓·克莉史汀生 (Clayton Christensen) 於《創新的兩難》中提出此概念。" },
      { id: 7, chapter: "CH03", question: "下列何者屬於雲端運算的三大服務模型之一，提供基礎運算與儲存硬體設施？", options: ["SaaS", "PaaS", "IaaS", "DaaS"], answer: 2, explanation: "IaaS (Infrastructure as a Service) 基礎設施即服務，提供伺服器與儲存設備。" },
      { id: 8, chapter: "CH03", question: "關係型資料庫 (RDBMS) 主要使用何種標準語言進行查詢？", options: ["Python", "SQL", "HTML", "Java"], answer: 1, explanation: "Structured Query Language (SQL) 是結構化查詢語言。" },
      { id: 9, chapter: "CH03", question: "關於 Big Data (巨量資料) 的 4V 特性，不包含下列何者？", options: ["Volume (容量)", "Velocity (速度)", "Variety (多樣性)", "Value (價值)"], answer: 3, explanation: "傳統 4V 為 Volume、Velocity、Variety、Veracity (真實性)。" },
      { id: 10, chapter: "CH04", question: "保障個人資料隱私權，歐盟所推行最嚴格的法規簡稱為？", options: ["GDPR", "HIPAA", "SOX", "ISO27001"], answer: 0, explanation: "GDPR 為歐盟通用資料保護規則 (General Data Protection Regulation)。" },
      { id: 11, chapter: "CH04", question: "資訊安全黃金三角 (CIA Triad) 指的是機密性、完整性與？", options: ["可用性 (Availability)", "真實性 (Authenticity)", "授權 (Authorization)", "不可否認性"], answer: 0, explanation: "CIA 三要素為 Confidentiality (機密性)、Integrity (完整性) 與 Availability (可用性)。" },
      { id: 12, chapter: "CH05", question: "機器學習中，若訓練資料包含輸入特徵與對應的標準答案標籤，此訓練方式稱為？", options: ["非監督式學習", "監督式學習", "增強學習", "半監督學習"], answer: 1, explanation: "提供正確標籤 (Label) 讓模型的學習過程稱為監督式學習 (Supervised Learning)。" },
      { id: 13, chapter: "CH05", question: "人工智慧深度學習 (Deep Learning) 技術的核心架構是基於？", options: ["決策樹", "人工神經網絡 (ANN)", "支持向量機 (SVM)", "K-均值群集"], answer: 1, explanation: "深度學習建構於多層的人工神經網絡 (Artificial Neural Network) 架構上。" },
      { id: 14, chapter: "CH06", question: " agile 敏捷專案管理開發框架中，最常採用的短週期迭代稱為？", options: ["Waterfall", "Sprint", "Milestone", "Gantt"], answer: 1, explanation: "Scrum/Agile 敏捷開發以 Sprint (衝刺) 為固定週期的開發迭代。" },
      { id: 15, chapter: "CH06", question: "專案管理三重約束 (Triple Constraint) 三要素通常包含時間、範疇與？", options: ["品質", "成本", "風險", "人力"], answer: 1, explanation: "專案管理傳統三角限制為範疇 (Scope)、時間 (Time) 與成本 (Cost)。" }
    ];

    // App State Management
    class QuizApp {
      constructor() {
        this.allQuestions = JSON.parse(localStorage.getItem('quiz_bank')) || DEFAULT_QUESTION_BANK;
        this.activeQuestions = [...this.allQuestions];
        this.currentIndex = 0;
        this.currentMode = 'practice'; // 'practice', 'exam', 'mistakes', 'starred'
        this.currentChapterFilter = 'ALL';
        this.userAnswers = {}; // { qId: selectedOptionIndex }
        this.mistakes = new Set(JSON.parse(localStorage.getItem('quiz_mistakes')) || []);
        this.starred = new Set(JSON.parse(localStorage.getItem('quiz_starred')) || []);
        
        this.timerInterval = null;
        this.examTimeRemaining = 1800; // 30 mins in sec

        this.init();
      }

      init() {
        this.applyFilter();
        this.updateBadges();
        this.renderQuestionGrid();
        this.renderCurrentQuestion();
        lucide.createIcons();
      }

      saveState() {
        localStorage.setItem('quiz_bank', JSON.stringify(this.allQuestions));
        localStorage.setItem('quiz_mistakes', JSON.stringify([...this.mistakes]));
        localStorage.setItem('quiz_starred', JSON.stringify([...this.starred]));
        this.updateBadges();
      }

      updateBadges() {
        document.getElementById('mistakeBadge').innerText = this.mistakes.size;
        document.getElementById('starredBadge').innerText = this.starred.size;
      }

      filterChapter(chapter) {
        this.currentChapterFilter = chapter;
        this.applyFilter();
      }

      applyFilter() {
        let base = this.allQuestions;

        if (this.currentMode === 'mistakes') {
          base = base.filter(q => this.mistakes.has(q.id));
        } else if (this.currentMode === 'starred') {
          base = base.filter(q => this.starred.has(q.id));
        }

        if (this.currentChapterFilter !== 'ALL') {
          base = base.filter(q => q.chapter === this.currentChapterFilter);
        }

        this.activeQuestions = base;
        this.currentIndex = 0;
        document.getElementById('totalQuestionsCount').innerText = this.activeQuestions.length;

        this.renderQuestionGrid();
        this.renderCurrentQuestion();
        this.updateProgress();
      }

      switchTab(mode) {
        this.currentMode = mode;

        // Reset Tab Styles
        ['practice', 'exam', 'mistakes', 'starred'].forEach(m => {
          const btn = document.getElementById(`tab-${m}`);
          if (btn) {
            btn.className = m === mode
              ? 'py-3 px-1 border-b-2 font-medium text-sm border-indigo-600 text-indigo-600 flex items-center gap-2'
              : 'py-3 px-1 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2';
          }
        });

        const examHeader = document.getElementById('examHeader');
        if (mode === 'exam') {
          examHeader.classList.remove('hidden');
          this.startExamTimer();
        } else {
          examHeader.classList.add('hidden');
          this.stopExamTimer();
        }

        this.applyFilter();
      }

      renderQuestionGrid() {
        const grid = document.getElementById('questionGrid');
        grid.innerHTML = '';

        if (this.activeQuestions.length === 0) {
          grid.innerHTML = '<p class="col-span-5 text-xs text-slate-400 text-center py-4">無題目</p>';
          return;
        }

        this.activeQuestions.forEach((q, idx) => {
          const btn = document.createElement('button');
          btn.innerText = idx + 1;
          
          let statusClass = 'bg-slate-100 text-slate-600 hover:bg-slate-200';
          if (this.userAnswers[q.id] !== undefined) {
            if (this.currentMode === 'exam') {
              statusClass = 'bg-indigo-100 text-indigo-700 font-bold';
            } else {
              const isCorrect = this.userAnswers[q.id] === q.answer;
              statusClass = isCorrect ? 'bg-emerald-100 text-emerald-700 font-bold' : 'bg-rose-100 text-rose-700 font-bold';
            }
          }

          if (idx === this.currentIndex) {
            statusClass += ' ring-2 ring-indigo-600 ring-offset-1';
          }

          btn.className = `w-full h-8 text-xs rounded-lg font-medium transition flex items-center justify-center ${statusClass}`;
          btn.onclick = () => {
            this.currentIndex = idx;
            this.renderCurrentQuestion();
            this.renderQuestionGrid();
          };

          grid.appendChild(btn);
        });
      }

      renderCurrentQuestion() {
        const q = this.activeQuestions[this.currentIndex];

        if (!q) {
          document.getElementById('questionText').innerText = '此分類下無題目。';
          document.getElementById('optionsContainer').innerHTML = '';
          document.getElementById('explanationBox').classList.add('hidden');
          return;
        }

        document.getElementById('questionChapterTag').innerText = q.chapter || '未分類';
        document.getElementById('questionIndexTag').innerText = `Question ${this.currentIndex + 1} / ${this.activeQuestions.length}`;
        document.getElementById('questionText').innerText = q.question;

        // Star button
        const starBtn = document.getElementById('starBtn');
        if (this.starred.has(q.id)) {
          starBtn.className = 'p-2 text-amber-400 hover:text-amber-500 rounded-lg transition';
        } else {
          starBtn.className = 'p-2 text-slate-300 hover:text-amber-400 rounded-lg transition';
        }

        // Render Options
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        const selectedOpt = this.userAnswers[q.id];

        q.options.forEach((optText, optIdx) => {
          const optBtn = document.createElement('button');
          optBtn.className = 'w-full text-left p-4 rounded-xl border text-sm font-medium transition flex items-center justify-between cursor-pointer ';

          if (selectedOpt === undefined) {
            optBtn.className += 'border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/50 text-slate-700';
          } else {
            if (this.currentMode === 'exam') {
              if (selectedOpt === optIdx) {
                optBtn.className += 'border-indigo-500 bg-indigo-50 text-indigo-800 font-semibold';
              } else {
                optBtn.className += 'border-slate-200 bg-white text-slate-500 opacity-60';
              }
            } else {
              // Practice mode immediate feedback
              if (optIdx === q.answer) {
                optBtn.className += 'border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold';
              } else if (selectedOpt === optIdx) {
                optBtn.className += 'border-rose-500 bg-rose-50 text-rose-900 font-semibold';
              } else {
                optBtn.className += 'border-slate-100 bg-slate-50 text-slate-400 opacity-50';
              }
            }
          }

          optBtn.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-full border border-current flex items-center justify-center text-xs">${String.fromCharCode(65 + optIdx)}</span>
              <span>${optText}</span>
            </div>
          `;

          optBtn.onclick = () => this.selectOption(optIdx);
          container.appendChild(optBtn);
        });

        // Explanation Box
        const expBox = document.getElementById('explanationBox');
        if (selectedOpt !== undefined && this.currentMode !== 'exam') {
          expBox.classList.remove('hidden');
          document.getElementById('explanationText').innerText = q.explanation || '暫無詳細解析。';
        } else {
          expBox.classList.add('hidden');
        }

        // Buttons
        document.getElementById('prevBtn').disabled = this.currentIndex === 0;
        document.getElementById('nextBtn').disabled = this.currentIndex === this.activeQuestions.length - 1;

        this.renderQuestionGrid();
        this.updateProgress();
      }

      selectOption(optIdx) {
        const q = this.activeQuestions[this.currentIndex];
        if (!q) return;

        this.userAnswers[q.id] = optIdx;

        if (this.currentMode !== 'exam') {
          if (optIdx !== q.answer) {
            this.mistakes.add(q.id);
          } else {
            this.mistakes.delete(q.id);
          }
          this.saveState();
        }

        this.renderCurrentQuestion();
      }

      toggleStarCurrent() {
        const q = this.activeQuestions[this.currentIndex];
        if (!q) return;

        if (this.starred.has(q.id)) {
          this.starred.delete(q.id);
        } else {
          this.starred.add(q.id);
        }
        this.saveState();
        this.renderCurrentQuestion();
      }

      toggleExplanation() {
        const expBox = document.getElementById('explanationBox');
        expBox.classList.toggle('hidden');
      }

      nextQuestion() {
        if (this.currentIndex < this.activeQuestions.length - 1) {
          this.currentIndex++;
          this.renderCurrentQuestion();
        }
      }

      prevQuestion() {
        if (this.currentIndex > 0) {
          this.currentIndex--;
          this.renderCurrentQuestion();
        }
      }

      shuffleQuestions() {
        this.activeQuestions.sort(() => Math.random() - 0.5);
        this.currentIndex = 0;
        this.renderQuestionGrid();
        this.renderCurrentQuestion();
      }

      updateProgress() {
        const answeredCount = Object.keys(this.userAnswers).length;
        const total = this.allQuestions.length;
        const pct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;

        document.getElementById('progressBar').style.width = `${pct}%`;
        document.getElementById('progressText').innerText = `${pct}% (${answeredCount}/${total})`;
      }

      // Exam Mode Timer
      startExamTimer() {
        this.stopExamTimer();
        this.examTimeRemaining = 1800;
        this.timerInterval = setInterval(() => {
          this.examTimeRemaining--;
          const m = Math.floor(this.examTimeRemaining / 60).toString().padStart(2, '0');
          const s = (this.examTimeRemaining % 60).toString().padStart(2, '0');
          document.getElementById('examTimer').innerText = `${m}:${s}`;

          if (this.examTimeRemaining <= 0) {
            this.submitExam();
          }
        }, 1000);
      }

      stopExamTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
      }

      submitExam() {
        this.stopExamTimer();
        let correctCount = 0;
        let totalExam = this.activeQuestions.length;

        this.activeQuestions.forEach(q => {
          if (this.userAnswers[q.id] === q.answer) {
            correctCount++;
          } else {
            this.mistakes.add(q.id);
          }
        });

        this.saveState();
        const score = totalExam > 0 ? Math.round((correctCount / totalExam) * 100) : 0;

        if (score >= 80) {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        alert(`測驗結束！\n您的得分：${score} 分 (${correctCount} / ${totalExam})`);
        this.switchTab('practice');
      }

      // Import Modal
      openImportModal() {
        document.getElementById('importModal').classList.remove('hidden');
      }

      closeImportModal() {
        document.getElementById('importModal').classList.add('hidden');
      }

      importJson() {
        const jsonText = document.getElementById('importJsonInput').value;
        try {
          const parsed = JSON.parse(jsonText);
          if (Array.isArray(parsed) && parsed.length > 0) {
            this.allQuestions = parsed.map((item, idx) => ({
              id: item.id || idx + 1,
              chapter: item.chapter || 'CH01',
              question: item.question,
              options: item.options,
              answer: item.answer,
              explanation: item.explanation || ''
            }));
            this.saveState();
            this.applyFilter();
            this.closeImportModal();
            alert('題庫匯入成功！');
          } else {
            alert('JSON 格式不正確：需為包含問題物件的陣列。');
          }
        } catch (e) {
          alert('JSON 解析失敗，請檢查格式是否正確。');
        }
      }

      loadDefaultBank() {
        this.allQuestions = DEFAULT_QUESTION_BANK;
        this.saveState();
        this.applyFilter();
        this.closeImportModal();
        alert('已恢復預載題庫。');
      }
    }

    // Initialize App
    const app = new QuizApp();
  </script>
</body>
</html>
